name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Hard invariants (CLAUDE.md) + non-ASCII lint. The script exits
      # nonzero on any violation, which fails the job.
      - run: npm run lint
      - run: npm ci
      - run: npm run build
      - run: npm test
